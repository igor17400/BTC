# @package _global_
#
# Smoke test: GLORY on synthetic data (2 epochs, tiny batch)
# Usage: python src/train.py experiment=smoke/glory framework=pytorch

defaults:
  - /spec: glory
  - /dataset: synthetic
  - /sampling: base
  - _self_

name: smoke_glory
model_name: GLORY
seed: 42

dataset:
  max_title_length: ${spec.inputs.title.max_length}
  max_history_length: ${spec.inputs.history.max_length}
  max_impressions_length: ${spec.inputs.impressions.max_length}
  embedding_size: ${spec.model.embedding.size}
  process_title: ${spec.inputs.process_title}
  process_abstract: ${spec.inputs.process_abstract}
  process_category: ${spec.inputs.process_category}
  process_subcategory: ${spec.inputs.process_subcategory}
  process_user_id: ${spec.inputs.process_user_id}

train:
  batch_size: 4
  num_epochs: 2
  learning_rate: 0.0002
  gradient_clip_val: 1.0
  early_stopping:
    patience: 1
    min_improvement: 0.01

eval:
  fast_evaluation: true
  batch_size: 64
  run_initial_eval: false
  run_test_after_training: true
  save_predictions: false

sampling:
  max_impressions_length: ${spec.inputs.impressions.max_length}
  strategy: random
  random:
    replace: false

logging:
  enable_wandb: false

metrics:
  params: {}

device:
  gpu_ids: [0]
  precision: float32
  keras_backend: jax
