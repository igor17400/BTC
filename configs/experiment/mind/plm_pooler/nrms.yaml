# @package _global_
#
# NRMS on MIND-small with frozen token-level PLM + trainable pooler.
#
# Uses the ``bert_token`` encoder (BERT-base-uncased, token-level cache)
# with the IP2-style attention pooler. Trainable params at train time:
# the pooler (MHA + AdditiveAttention) + the (plm_dim -> news_dim)
# projection. The PLM itself is frozen.
#
# PyTorch only — JAX has no PLMTokenNewsEncoder.
# Usage: python src/train.py experiment=mind/plm_pooler/nrms framework=pytorch

defaults:
  - /spec: nrms
  - /dataset: mind
  - /sampling: base
  - /encoder: bert_token
  - _self_

name: mind_nrms_plm_pooler
model_name: NRMS
seed: 42

# Dataset: bridge spec inputs → dataset processing flags
dataset:
  version: small
  max_title_length: ${spec.inputs.title.max_length}
  max_history_length: ${spec.inputs.history.max_length}
  process_title: ${spec.inputs.process_title}
  process_abstract: ${spec.inputs.process_abstract}
  process_category: ${spec.inputs.process_category}
  process_subcategory: ${spec.inputs.process_subcategory}
  process_user_id: ${spec.inputs.process_user_id}

# Training: from spec
train:
  batch_size: ${spec.training.batch_size}
  num_epochs: ${spec.training.num_epochs}
  learning_rate: ${spec.training.learning_rate}
  early_stopping:
    patience: ${spec.training.early_stopping.patience}
    min_improvement: ${spec.training.early_stopping.min_improvement}

# Evaluation: from spec
eval:
  fast_evaluation: true
  batch_size: ${spec.evaluation.batch_size}

# Sampling: from spec
sampling:
  max_impressions_length: ${spec.inputs.impressions.max_length}
  strategy: ${spec.training.negative_sampling.strategy}
  random:
    replace: false

device:
  gpu_ids: [0]
  precision: float32
