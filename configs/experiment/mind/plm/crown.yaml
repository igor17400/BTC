# @package _global_
#
# CROWN on MIND-small with frozen token-level PLM word embeddings.
#
# CROWN is two-view (title + abstract). Under PLM, both views are
# served from separate PLM caches indexed by parsed news_idx:
#   - title:    plm_token_embeddings_by_id           (T=32  by default)
#   - abstract: plm_abstract_token_embeddings_by_id  (A=128 by default)
# Both project plm_dim -> embedding_size before CROWN's transformer +
# k-intent disentanglement pipeline (unchanged from GloVe).
#
# GPU footprint: ~6.4 GB title cache + ~25 GB abstract cache @ T=128.
# If memory-constrained, drop max_length_abstract here.
#
# Usage: python src/train.py experiment=mind/plm/crown framework=pytorch

defaults:
  - /spec: crown
  - /dataset: mind
  - /sampling: base
  - /encoder: bert
  - _self_

name: mind_crown_plm
model_name: CROWN
seed: 42

encoder:
  # CROWN consumes both views; keep the encoder's abstract cache.
  text_field_abstract: abstract
  max_length: ${spec.inputs.title.max_length}
  # CROWN spec defaults abstract to 128 tokens, but the resulting
  # ~25 GB PLM token cache loads into Python after writing and OOM-
  # kills the host (~64 GB RAM ceiling, ~57 GB anon-rss observed).
  # Cap at 50 here -> ~10 GB cache. Matches every other multi-view
  # PLM model (NAML, ...).
  max_length_abstract: 50

dataset:
  version: small
  max_title_length: ${spec.inputs.title.max_length}
  max_abstract_length: ${spec.inputs.abstract.max_length}
  max_history_length: ${spec.inputs.history.max_length}
  max_impressions_length: ${spec.inputs.impressions.max_length}
  embedding_size: ${spec.model.embedding.size}
  process_title: ${spec.inputs.process_title}
  process_abstract: ${spec.inputs.process_abstract}
  process_category: ${spec.inputs.process_category}
  process_subcategory: ${spec.inputs.process_subcategory}
  process_user_id: ${spec.inputs.process_user_id}

train:
  batch_size: ${spec.training.batch_size}
  num_epochs: ${spec.training.num_epochs}
  learning_rate: ${spec.training.learning_rate}
  gradient_clip_val: ${spec.training.gradient_clip_val}
  grad_accum_steps: ${spec.training.grad_accum_steps}
  early_stopping:
    patience: ${spec.training.early_stopping.patience}
    min_improvement: ${spec.training.early_stopping.min_improvement}

eval:
  fast_evaluation: true
  batch_size: ${spec.evaluation.batch_size}

sampling:
  max_impressions_length: ${spec.inputs.impressions.max_length}
  strategy: ${spec.training.negative_sampling.strategy}
  random:
    replace: false

device:
  gpu_ids: [0]
  precision: bfloat16
