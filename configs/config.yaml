defaults:
- _self_
- experiment: mind/nrms  # default experiment (loads spec + dataset)
- override hydra/hydra_logging: disabled
- override hydra/job_logging: disabled

# Hydra configuration
hydra:
  run:
    dir: ${output_base_dir}/${name}/${framework}/${now:%Y-%m-%d-%H-%M-%S}
  sweep:
    dir: ${output_base_dir}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false

# Framework selection (override per run: framework=pytorch)
framework: keras  # Options: keras, pytorch, jax

# Basic configuration
seed: 42
output_base_dir: outputs
device:
  gpu_ids: [0]
  memory_limit: 1
  keras_backend: jax  # Options: jax, torch
num_workers: 4

# Default training parameters (overridden by experiment → spec)
train:
  batch_size: 32
  num_epochs: 10
  learning_rate: 0.0001
  gradient_clip_val: 1.0
  early_stopping:
    patience: 5
    min_improvement: 0.01

# Default evaluation parameters (overridden by experiment → spec)
eval:
  fast_evaluation: true
  batch_size: 4096
  save_predictions: true
  predictions_dir: predictions
  run_initial_eval: false
  run_test_after_training: true

# Default logging configuration
logging:
  project_name: NewsReX
  enable_wandb: true
  experiment_name: ${framework}/${dataset.name}/${model_name}
  wandb_group: ${framework}/${dataset.name}/${model_name}

# Metrics configuration
metrics:
  params: {}
  _target_: src.core.metrics.functions.NewsRecommenderMetrics

# Cache configuration
cache:
  root_dir: .cache
  clear_on_start: false
