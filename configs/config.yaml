defaults:
- _self_
- experiment: mind/glove/nrms  # default experiment (loads spec + dataset + encoder)
- override hydra/hydra_logging: disabled
- override hydra/job_logging: disabled

# Hydra configuration
hydra:
  run:
    # Path layout segregates runs by validation_split_strategy and encoder
    # so `random` vs `dev_as_val`, and GloVe vs PLM variants, don't
    # overwrite each other. ``encoder.slug`` defaults to ``glove`` so
    # existing GloVe paths gain a stable extra segment.
    dir: ${output_base_dir}/train/${dataset.name}/${model_name}/${framework}/${encoder.slug}/${dataset.validation_split_strategy}/seed_${seed}
  sweep:
    # Multirun jobs land at the same structured path as single runs,
    # not in a timestamped "multirun/" silo. Each override produces a
    # unique (model_name, framework, encoder, split, seed) tuple so
    # subdirs don't collide.
    dir: ${output_base_dir}/train
    subdir: ${dataset.name}/${model_name}/${framework}/${encoder.slug}/${dataset.validation_split_strategy}/seed_${seed}
  job:
    chdir: false

# Framework selection (override per run: framework=pytorch)
framework: jax  # Options: pytorch, jax

# Pre-trained weights for eval-only mode (used by src/eval.py)
weights: null

# Basic configuration
seed: 42
output_base_dir: outputs
device:
  gpu_ids: [0]
  memory_limit: 1
num_workers: 4

# Default training parameters (overridden by experiment → spec)
train:
  batch_size: 512
  num_epochs: 10
  learning_rate: 0.0001
  gradient_clip_val: 1.0
  grad_accum_steps: 1
  early_stopping:
    patience: 3
    min_improvement: 0.01

# Default evaluation parameters (overridden by experiment → spec)
eval:
  fast_evaluation: true
  batch_size: 4096
  save_predictions: true
  predictions_dir: predictions
  run_initial_eval: false
  run_test_after_training: true

# Default logging configuration
logging:
  project_name: NewsReX
  enable_wandb: true
  # Include the validation split strategy AND encoder in W&B names so
  # random / dev_as_val and GloVe / PLM variants don't share a name and
  # group. The segments mirror the output directory layout above.
  experiment_name: ${framework}/${dataset.name}/${model_name}/${encoder.slug}/${dataset.validation_split_strategy}
  wandb_group: ${framework}/${dataset.name}/${model_name}/${encoder.slug}/${dataset.validation_split_strategy}
  progress_backend: rich  # "rich" (interactive) or "tqdm" (line-by-line, for background agents)

# Metrics configuration
metrics:
  params: {}
  _target_: src.core.metrics.functions.NewsRecommenderMetrics

# Multi-seed evaluation (for paper-ready results with mean ± std)
multi_seed:
  enabled: false
  seeds: [42, 123, 456]

# Cache configuration
cache:
  root_dir: .cache
  clear_on_start: false
