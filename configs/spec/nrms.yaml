model:
  name: nrms
  architecture:
    news_encoder:
      type: multi_head_self_attention
      num_heads: 20
      head_dim: 15
      attention_hidden_dim: 200
    user_encoder:
      type: multi_head_self_attention
      num_heads: 20
      head_dim: 15
      attention_hidden_dim: 200
    click_predictor:
      type: dot_product
    # Token-level PLM pooler (used only when encoder.type != 'glove').
    # IP2-style attention pool by default. Set type=mean for a cheap
    # ablation that collapses to sentence-level pooling.
    text_pooler:
      type: attention
      num_heads: 6
      head_dim: 128
      attention_query_dim: 200
      dropout_rate: 0.0
  embedding:
    size: 300
    trainable: true
  dropout_rate: 0.2
  seed: 42

inputs:
  title: { max_length: 32 }
  history: { max_length: 50 }
  impressions: { max_length: 5 }
  process_title: true
  process_abstract: false
  process_category: false
  process_subcategory: false
  process_user_id: false

training:
  loss:
    name: categorical_crossentropy
    from_logits: true
    reduction: sum_over_batch_size
    label_smoothing: 0.0
  optimizer: adam
  learning_rate: 0.0001
  batch_size: 256
  num_epochs: 10
  early_stopping:
    patience: 3
    min_improvement: 0.01
  negative_sampling:
    strategy: random
    candidates: 4

evaluation:
  mode: fast
  metrics: [auc, mrr, ndcg@5, ndcg@10]
  batch_size: 256
