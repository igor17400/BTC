model:
  name: pprec
  architecture:
    news_encoder:
      type: multi_head_self_attention
      news_dim: 400
      num_heads: 20
      head_dim: 20
      # Bidirectional cross-attention (paper "co1" encoder, MHCA between
      # title words and entities). Paper uses 5 heads x 40 dim = 200 total.
      co_num_heads: 5
      co_head_dim: 40
      attention_hidden_dim: 200
      entity_embedding_dim: 100
      category_embedding_dim: 200
    # Popularity components
    use_entity: true
    use_recency: true
    use_ctr: true
    use_activity_gate: true
    popularity_embedding_bins: 200
    popularity_embedding_dim: 400
    recency_embedding_bins: 1500
    recency_embedding_dim: 100
    ctr_scaler_init: 19.0
    # PopularityPredictor MLP widths (paper PP-Rec official code)
    pop_content_dims: [256, 256, 128]   # news_dim -> 256 -> 256 -> 128 -> 1
    pop_recency_dims: [64, 64]          # recency_emb -> 64 -> 64 -> 1
    pop_gate_dims: [128, 64]            # concat[news, rec] -> 128 -> 64 -> 1 (sigmoid)
    activity_gate_hidden_dim: 64        # ActivityGater: news_dim -> 64 -> 1 (sigmoid)
  embedding:
    size: 300
    trainable: true
  dropout_rate: 0.2
  seed: 42

inputs:
  title: { max_length: 32 }
  history: { max_length: 50 }
  impressions: { max_length: 5 }
  max_entities: 5
  process_title: true
  process_abstract: false
  process_category: true
  process_subcategory: false
  process_user_id: false

training:
  loss:
    name: categorical_crossentropy
    from_logits: true
    reduction: sum_over_batch_size
    label_smoothing: 0.0
  optimizer: adam
  learning_rate: 0.0001
  batch_size: 512
  num_epochs: 5
  early_stopping:
    patience: 3
    min_improvement: 0.01
  negative_sampling:
    strategy: random
    candidates: 4

evaluation:
  mode: fast
  evaluator: pp_rec
  metrics: [auc, mrr, ndcg@5, ndcg@10]
  batch_size: 256
