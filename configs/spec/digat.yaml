model:
  name: digat
  architecture:
    news_encoder:
      type: msa
      msa_head_num: 16
      msa_head_dim: 25 # news_embedding_dim = 16 * 25 = 400
      attention_dim: 256
    graph_encoder:
      type: digat
      graph_depth: 3
      sag_hops: 2
      sag_neighbors: 5
    click_predictor:
      type: dot_product
  embedding:
    size: 300
    trainable: true
  dropout_rate: 0.2
  seed: 42

inputs:
  title: { max_length: 32 }
  history: { max_length: 50 }
  impressions: { max_length: 5 }
  process_title: true
  process_abstract: false
  process_category: true
  process_subcategory: false
  process_user_id: false

training:
  loss:
    name: categorical_crossentropy
    from_logits: true
    reduction: sum_over_batch_size
    label_smoothing: 0.0
  optimizer: adam
  learning_rate: 0.0001
  batch_size: 64 # paper default
  grad_accum_steps: 1
  num_epochs: 20 # paper: 16 for MIND-small
  gradient_clip_val: 1.0
  early_stopping:
    patience: 5
    min_improvement: 0.001
  negative_sampling:
    strategy: random
    candidates: 4

evaluation:
  mode: fast
  evaluator: default
  metrics: [auc, mrr, ndcg@5, ndcg@10]
  batch_size: 256
