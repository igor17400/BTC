model:
  name: caum
  architecture:
    news_encoder:
      type: multi_head_self_attention
      num_heads: 20
      head_dim: 20
      attention_hidden_dim: 200
      entity_embedding_dim: 100
      entity_num_heads: 4
      entity_head_dim: 40
      category_embedding_dim: 100
    user_encoder:
      type: candidate_aware
      candi_selfatt:
        num_heads: 20
        head_dim: 20
      candi_cnn:
        half_window: 1
      candi_att:
        hidden_dim: 400
        mid_dim: 256
    click_predictor:
      type: dot_product
  embedding:
    size: 300
    trainable: true
  news_dim: 400
  use_entity: true
  use_category: true
  dropout_rate: 0.2
  seed: 42

inputs:
  title: { max_length: 30 }
  history: { max_length: 50 }
  impressions: { max_length: 5 }
  max_entities: 5
  process_title: true
  process_abstract: false
  process_category: true
  process_subcategory: false
  process_user_id: false
  process_entities: true

training:
  loss:
    name: categorical_crossentropy
    from_logits: true
    reduction: sum_over_batch_size
    label_smoothing: 0.0
  optimizer: adam
  learning_rate: 0.00005
  batch_size: 64
  num_epochs: 10
  gradient_clip_val: 1.0
  grad_accum_steps: 1
  early_stopping:
    patience: 3
    min_improvement: 0.01
  negative_sampling:
    strategy: random
    candidates: 4

evaluation:
  mode: fast
  evaluator: caum
  metrics: [auc, mrr, ndcg@5, ndcg@10]
  batch_size: 256
