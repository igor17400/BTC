model:
  name: crown
  # PyTorch-backed: torch_geometric gives the graph models (CROWN/DIGAT/GLORY)
  # mature scatter/gather ops over variable-size subgraphs. A faithful JAX port
  # is feasible but unmaintained, so framework=jax is gated in
  # src/core/models/spec.py:_check_framework_supported.
  supported_frameworks: [pytorch]
  architecture:
    news_encoder:
      type: transformer_intent_disentanglement
      # Transformer: 1 layer, 10 heads, FFN 512 (paper defaults)
      num_heads: 10
      head_dim: 30 # 300 / 10
      feedforward_dim: 512
      num_layers: 1
      # Intent disentanglement: k=3 intents, dim=400
      intent_num: 3
      intent_embedding_dim: 400
      attention_dim: 400
    user_encoder:
      type: bipartite_gnn_candidate_aware
      # Bipartite user<->history GNN with one zero-init user-proxy node
      # per behaviour, followed by candidate-aware scaled dot-product
      # attention (Q = candidate, K/V = GNN-updated history).
      #
      # ``gnn_type`` selects the 1-layer GNN family:
      #   * "graphsage" — matches the reference CODE
      #                   (``GraphSAGE(num_layers=1)`` in PyG). Default.
      #   * "gat"       — matches the paper TEXT (§4.2.(3-b): "We use GAT").
      # Default 'graphsage' honours [[feedback_paper_vs_reference_code]]
      # ("when paper and code disagree, trust the code").
      gnn_type: graphsage
      graph_num_layers: 1
      gat_num_heads: 4
      gat_alpha: 0.2
      user_attention_dim: 400
    click_predictor:
      type: dot_product
  embedding:
    size: 300
    trainable: true # paper freezes word embeddings but trains others
  # Paper uses 50-dim for both (not 100)
  category_embedding_dim: 50
  subcategory_embedding_dim: 50
  dropout_rate: 0.2
  seed: 42

inputs:
  title: { max_length: 32 }
  abstract: { max_length: 128 } # paper Table 8: max content length = 128
  history: { max_length: 50 }
  impressions: { max_length: 5 }
  process_title: true
  process_abstract: true
  process_category: true
  process_subcategory: true
  process_user_id: false

training:
  loss:
    name: categorical_crossentropy
    from_logits: true
    reduction: sum_over_batch_size
    label_smoothing: 0.0
  # Auxiliary loss (category prediction) is computed inside the model
  # and weighted by alpha=0.3
  auxiliary_alpha: 0.3
  optimizer: adam
  # Paper uses 5e-5 at bs=16; we scale to match project convention
  # (NRMS/NAML/LSTUR/PP-Rec all use 1e-4 at bs=256).
  learning_rate: 0.0001
  # abstract=128 + graph=5 pushes past 40 GiB at bs=256; use accum for effective 256.
  batch_size: 64
  grad_accum_steps: 4
  num_epochs: 10
  gradient_clip_val: 4.0 # paper: gradient clipping at norm 4
  early_stopping:
    patience: 3 # paper Table 8: early stopping = 5
    min_improvement: 0.01
  negative_sampling:
    strategy: random
    candidates: 4 # paper: 4 negatives per positive

evaluation:
  mode: fast
  evaluator: default
  metrics: [auc, mrr, ndcg@5, ndcg@10]
  batch_size: 64
