_target_: src.core.data.datasets.mind.MINDDataset

# Inherit from base configuration
defaults:
  - base

# Dataset configuration
name: "MIND-${dataset.version}"
version: "small" # Options: small, large
embedding_type: "glove" # Options: glove, bert
embedding_size: 300 # Size of the embeddings
random_train_samples: false
validation_split_strategy: "random" # Options: chronological, random
validation_split_percentage: 0.05
validation_split_seed: 42

# Data sampling fractions
data_fraction_train: 1.0
data_fraction_val: 1.0
data_fraction_test: 1.0

# Dataset mode
mode: "train"

# Word threshold for vocabulary
word_threshold: 5

# Dataset URLs (HuggingFace mirror — original Microsoft URLs are dead)
urls:
  small:
    train: "https://huggingface.co/datasets/yjw1029/MIND/resolve/main/MINDsmall_train.zip"
    valid: "https://huggingface.co/datasets/yjw1029/MIND/resolve/main/MINDsmall_dev.zip"
  large:
    train: "https://huggingface.co/datasets/yjw1029/MIND/resolve/main/MINDlarge_train.zip"
    valid: "https://huggingface.co/datasets/yjw1029/MIND/resolve/main/MINDlarge_dev.zip"
    test: "https://huggingface.co/datasets/yjw1029/MIND/resolve/main/MINDlarge_test.zip"

# Preprocessing parameters
max_title_length: 30
max_abstract_length: 50
max_history_length: 50
max_impressions_length: 5

# Knowledge graph configuration
use_knowledge_graph: false # Enable/disable knowledge graph processing
max_entities: 5 # Max entities per news article (overridden by spec when available)
max_relations: 50

# Pass sampling configuration directly
sampling: ${sampling}

# Process Title / Abstract / Category / Subcategory
process_title: false
process_abstract: false
process_category: false
process_subcategory: false
process_user_id: false
process_entities: false

# Popularity feature configuration (PP-Rec)
popularity:
  # CTR computation method. Options: aggregate, age_bucketed, wall_clock
  ctr_method: wall_clock
  # Width of each time bucket in hours
  bucket_hours: 2
  # Maximum number of time buckets (should match recency_embedding_bins in spec)
  max_buckets: 1500
  # Laplace smoothing constant for CTR computation
  ctr_smoothing: 0.01
