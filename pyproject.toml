[project]
name = "newsrex"
version = "0.1.0"
description = "A modular framework for news recommendation systems research using Keras, JAX, and Hydra"
authors = [{ name = "Igor L.R. Azevedo", email = "igorazevedo@acm.org" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  # Core (always required)
  "hydra-core>=1.3.2",
  "numpy>=2.3.2",
  "pandas>=2.0.0",
  "PyYAML>=6.0",
  "rich>=13.0.0",
  "tqdm>=4.65.0",
  "omegaconf>=2.3.0",
  # ML utilities
  "scikit-learn>=1.3.0",
  "nltk>=3.9.1",
  "networkx>=3.5",
  # Experiment tracking
  "wandb>=0.17.2",
  # Visualization
  "plotly>=5.13.0",
  "seaborn>=0.12.0",
  "wordcloud>=1.9.0",
  "sentence-transformers>=5.4.0",
  "pyarrow>=23.0.1",
]

[project.optional-dependencies]
# ----- Framework extras -----
# Convention: bare name = CPU/portable default, "-cuda" suffix = NVIDIA GPU.
# Compose with --extra dev for development tools.

keras = ["keras>=3.10.0"]

# JAX
jax = [
  "keras>=3.10.0",
  "jax>=0.6.2",
  "jaxlib>=0.6.2",
  "flax>=0.10.0",
  "optax>=0.2.5",
]
jax-cuda = ["newsrex[jax]", "jax-cuda12-plugin>=0.6.2"]

# PyTorch — pick ONE: pytorch (CPU/macOS), cu118, cu124, cu126, cu130
pytorch = ["keras>=3.10.0", "torch>=2.6.0"]
cu118 = ["keras>=3.10.0", "torch>=2.6.0"]
cu124 = ["keras>=3.10.0", "torch>=2.6.0"]
cu126 = ["keras>=3.10.0", "torch>=2.6.0"]
cu130 = ["keras>=3.10.0", "torch>=2.6.0"]

# All frameworks (Keras + JAX + PyTorch)
all = ["newsrex[jax]", "newsrex[pytorch]"]
all-cu118 = ["newsrex[jax]", "newsrex[cu118]", "newsrex[jax-cuda]"]
all-cu124 = ["newsrex[jax]", "newsrex[cu124]", "newsrex[jax-cuda]"]
all-cu126 = ["newsrex[jax]", "newsrex[cu126]", "newsrex[jax-cuda]"]
all-cu130 = ["newsrex[jax]", "newsrex[cu130]", "newsrex[jax-cuda]"]

# Modal (remote GPU training)
modal = ["modal>=0.73.0"]

# Hyperparameter search
search = ["optuna>=3.6.0", "optuna-dashboard>=0.15.0"]

# VewsX visualization platform
viz = ["streamlit>=1.45.0", "scipy>=1.11.0", "wordcloud>=1.9.0"]

# Development tools — framework-agnostic. Compose with any framework extra:
#   uv sync --extra dev --extra all        # CPU dev environment
#   uv sync --extra dev --extra all-cuda   # GPU dev environment
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.8.0",
  "mypy>=1.4.0",
  "pre-commit>=3.3.0",
  "newsrex[search]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
  "reference_codes", # third-party reference implementations — keep verbatim
  "outputs",
  ".data",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false # respect trailing commas to keep multi-line formatting

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
]
ignore = [
  "E501",   # line length (handled by formatter)
  "B905",   # zip without strict= (python 3.10+)
  "SIM108", # ternary operator (readability preference)
]

[tool.ruff.lint.per-file-ignores]
# __init__.py files re-export public API; unused-import is intentional
"**/__init__.py" = ["F401"]
# Test entry points manipulate sys.path before importing — late imports are intentional
"tests/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.uv]
# Resolve for both macOS (dev) and Linux (SSH server / Modal).
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# PyTorch backends are mutually exclusive — pick only one.
conflicts = [
  [
    { extra = "pytorch" },
    { extra = "cu118" },
    { extra = "cu124" },
    { extra = "cu126" },
    { extra = "cu130" },
  ],
  [
    { extra = "all" },
    { extra = "all-cu118" },
    { extra = "all-cu124" },
    { extra = "all-cu126" },
    { extra = "all-cu130" },
  ],
]

# PyTorch wheel indexes per CUDA version.
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
# Route torch to the correct index based on the chosen extra.
torch = [
  { index = "pytorch-cu118", extra = "cu118" },
  { index = "pytorch-cu124", extra = "cu124" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportAttributeAccessIssue = false
reportPossiblyUnbound = false
reportArgumentType = false
reportOptionalCall = false
reportOptionalSubscript = false
reportOptionalMemberAccess = false
reportOperatorIssue = false
reportCallIssue = false
reportIndexIssue = false

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
