[project]
name = "newsrex"
version = "0.1.0"
description = "A modular framework for news recommendation systems research using Keras, JAX, and Hydra"
authors = [
  { name = "Igor L.R. Azevedo", email = "igorlima1740@gmail.com" },
  { name = "David Phol", email = "davidphol@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  # Core (always required)
  "hydra-core>=1.3.2",
  "numpy>=2.3.2",
  "pandas>=2.0.0",
  "PyYAML>=6.0",
  "rich>=13.0.0",
  "tqdm>=4.65.0",
  "omegaconf>=2.3.0",
  # ML utilities
  "scikit-learn>=1.3.0",
  "nltk>=3.9.1",
  "networkx>=3.5",
  # Experiment tracking
  "wandb>=0.17.2",
  # Visualization
  "plotly>=5.13.0",
  "seaborn>=0.12.0",
  "wordcloud>=1.9.0",
]

[project.optional-dependencies]
# Frameworks — install only what you need
keras = ["keras>=3.10.0"]
jax = [
  "keras>=3.10.0",
  "jax>=0.6.2",
  "jaxlib>=0.6.2",
  "flax>=0.10.0",
  "optax>=0.2.5",
]
jax-cuda = ["newsrex[jax]", "jax-cuda12-plugin>=0.6.2"]
pytorch = ["keras>=3.10.0", "torch>=2.6.0"]
pytorch-cu126 = ["keras>=3.10.0", "torch>=2.6.0"]
all = ["newsrex[jax]", "newsrex[pytorch]"]
all-cu126 = ["newsrex[jax-cuda]", "newsrex[pytorch-cu126]"]
# Hyperparameter search
search = ["optuna>=3.6.0", "optuna-dashboard>=0.15.0"]
# Development
dev = [
  "newsrex[all]",
  "newsrex[search]",
  "pytest>=7.4.0",
  "ruff>=0.8.0",
  "mypy>=1.4.0",
  "pytest-cov>=4.1.0",
  "pre-commit>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
  "reference_codes",  # third-party reference implementations — keep verbatim
  "outputs",
  ".data",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false # respect trailing commas to keep multi-line formatting

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
]
ignore = [
  "E501",   # line length (handled by formatter)
  "B905",   # zip without strict= (python 3.10+)
  "SIM108", # ternary operator (readability preference)
]

[tool.ruff.lint.per-file-ignores]
# __init__.py files re-export public API; unused-import is intentional
"**/__init__.py" = ["F401"]
# Test entry points manipulate sys.path before importing — late imports are intentional
"tests/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.uv]
# Pin torch to cu126 index so `uv sync` doesn't pull the wrong CUDA version
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "extra == 'pytorch-cu126' or extra == 'all-cu126'" }

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
