[project]
name = "newsrex"
version = "0.1.0"
description = "A modular framework for news recommendation systems research using Keras, JAX, and Hydra"
authors = [
    {name = "Igor L.R. Azevedo", email = "igorlima1740@gmail.com"},
    {name = "David Phol", email = "davidphol@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "keras>=3.10.0",
    "jax>=0.6.2",
    "jaxlib>=0.6.2",
    "hydra-core>=1.3.2",
    "wandb>=0.17.2",
    "pandas>=2.0.0",
    "numpy>=2.3.2",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "PyYAML>=6.0",
    "plotly>=5.13.0",
    "seaborn>=0.12.0",
    "wordcloud>=1.9.0",
    "transformers>=4.49.0",
    "nltk>=3.9.1",
    "networkx>=3.5",
    "optax>=0.2.5",
    "torch>=2.6.0",
    "flax>=0.10.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
cuda = ["jax-cuda12-plugin>=0.6.2"]
dev = [
    "pytest>=7.4.0",
    "black>=23.3.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
